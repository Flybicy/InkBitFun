<style id="openbitfun-appearance-default">
  :root {
    color-scheme: light dark;
    background: transparent;
    --openbitfun-radius: 8px;
    --openbitfun-radius-lg: 12px;
    --openbitfun-font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --openbitfun-font-mono: 'Fira Code', 'Cascadia Mono', 'Cascadia Code', Consolas, 'Liberation Mono', SFMono-Regular, 'SF Mono', Menlo, Monaco, 'Courier New', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, monospace;
    --openbitfun-bg: #0D0B09;
    --openbitfun-bg-secondary: #161310;
    --openbitfun-bg-tertiary: #0D0B09;
    --openbitfun-bg-elevated: #161310;
    --openbitfun-text: #E9E1D1;
    --openbitfun-text-secondary: #C6BBA7;
    --openbitfun-text-muted: #A1927F;
    --openbitfun-text-on-accent: #F5EFE4;
    --openbitfun-accent: #6489A0;
    --openbitfun-accent-hover: #537D96;
    --openbitfun-accent-secondary: #695E88;
    --openbitfun-success: #b5c4b1;
    --openbitfun-warning: #cab383;
    --openbitfun-error: #e9cbc3;
    --openbitfun-info: #b6c2ce;
    --openbitfun-border: rgba(240, 232, 216, 0.18);
    --openbitfun-border-subtle: rgba(240, 232, 216, 0.12);
    --openbitfun-element-bg: rgba(240, 232, 216, 0.08);
    --openbitfun-element-hover: rgba(240, 232, 216, 0.11);
    --openbitfun-focus-ring: #6489A0;
    --openbitfun-link: #6489A0;
    --openbitfun-field-bg: #161310;
    --openbitfun-field-border: rgba(240, 232, 216, 0.16);
    --openbitfun-field-border-focus: #7C6D5B;
    --openbitfun-scrollbar-thumb: rgba(240, 232, 216, 0.22);
    --openbitfun-scrollbar-thumb-hover: rgba(240, 232, 216, 0.32);
    --openbitfun-overlay-scrim: rgba(13, 11, 9, 0.62);
    --openbitfun-shadow-xs: 0 1px 2px rgba(13, 11, 9, 0.9);
    --openbitfun-shadow-sm: 0 2px 4px rgba(13, 11, 9, 0.8);
    --openbitfun-shadow-card: 0 2px 4px rgba(13, 11, 9, 0.8);
    --openbitfun-shadow-lg: 0 8px 16px rgba(13, 11, 9, 0.6);
    --openbitfun-shadow-xl: 0 12px 24px rgba(13, 11, 9, 0.5);
    --openbitfun-shadow-overlay: 0 4px 20px rgba(13, 11, 9, 0.48);
  }
  @media (prefers-color-scheme: light) {
    :root {
    --openbitfun-bg: #F5EFE4;
    --openbitfun-bg-secondary: #FDFAF3;
    --openbitfun-bg-tertiary: #EFE8DB;
    --openbitfun-bg-elevated: #FDFAF3;
    --openbitfun-text: rgba(42, 38, 34, 0.90);
    --openbitfun-text-secondary: rgba(42, 38, 34, 0.72);
    --openbitfun-text-muted: #6B6158;
    --openbitfun-text-on-accent: #FFFDF8;
    --openbitfun-accent: #537D96;
    --openbitfun-accent-hover: #3F6179;
    --openbitfun-accent-secondary: #554A70;
    --openbitfun-success: #2b3f2b;
    --openbitfun-warning: #3f3112;
    --openbitfun-error: #561c11;
    --openbitfun-info: #364a61;
    --openbitfun-border: rgba(42, 38, 34, 0.18);
    --openbitfun-border-subtle: rgba(42, 38, 34, 0.10);
    --openbitfun-element-bg: rgba(42, 38, 34, 0.06);
    --openbitfun-element-hover: rgba(42, 38, 34, 0.09);
    --openbitfun-focus-ring: #3F6179;
    --openbitfun-link: #3F6179;
    --openbitfun-field-bg: #FDFAF3;
    --openbitfun-field-border: rgba(42, 38, 34, 0.12);
    --openbitfun-field-border-focus: #7C6D5B;
    --openbitfun-scrollbar-thumb: rgba(42, 38, 34, 0.22);
    --openbitfun-scrollbar-thumb-hover: rgba(42, 38, 34, 0.32);
    --openbitfun-overlay-scrim: rgba(42, 38, 34, 0.22);
    --openbitfun-shadow-xs: 0 1px 2px rgba(42, 38, 34, 0.05);
    --openbitfun-shadow-sm: 0 2px 4px rgba(42, 38, 34, 0.06);
    --openbitfun-shadow-card: 0 2px 4px rgba(42, 38, 34, 0.06);
    --openbitfun-shadow-lg: 0 8px 16px rgba(42, 38, 34, 0.10);
    --openbitfun-shadow-xl: 0 12px 24px rgba(42, 38, 34, 0.12);
    --openbitfun-shadow-overlay: 0 4px 20px rgba(42, 38, 34, 0.12);
    }
  }
  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
    background: transparent;
  }
  *::-webkit-scrollbar-track,
  *::-webkit-scrollbar-track-piece,
  *::-webkit-scrollbar-corner,
  *::-webkit-scrollbar-button,
  *::-webkit-resizer {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    border-radius: 999px;
    background: var(--openbitfun-scrollbar-thumb);
  }
  *::-webkit-scrollbar-thumb:hover {
    background: var(--openbitfun-scrollbar-thumb-hover);
  }
  @supports (scrollbar-color: transparent transparent) {
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--openbitfun-scrollbar-thumb) transparent;
    }
  }
  @supports selector(::-webkit-scrollbar) {
    @supports not (scrollbar-color: transparent transparent) {
      * {
        scrollbar-width: auto !important;
      }
    }
  }
</style>
